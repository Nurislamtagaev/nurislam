<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lalafo — Категории</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 15px;
    }

    .subtitle {
        text-align: center;
        color: gray;
        margin-bottom: 35px;
    }

    .categories {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        max-width: 1100px;
        margin: auto;
    }

    .category {
        position: relative;
        height: 200px;
        border-radius: 15px;
        overflow: hidden;
        text-decoration: none;
        color: white;
        display: block;
    }

    .category img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.3s;
    }

    .category:hover img {
        transform: scale(1.1);
    }

    .category h2 {
        position: absolute;
        bottom: 10px;
        left: 15px;
        z-index: 2;
        font-size: 23px;
    }

    .category::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            transparent,
            rgba(0, 0, 0, 0.8)
        );
    }

</style>
</head>
<body>
<h1>Добро пожаловать в Lalafo</h1>

<p class="subtitle">
    Найди всё, что тебе нужно!
</p>

<h2>Категории</h2>

<div class="category">

    {% for c in category %}

        <a class="category"
           {% if category.title == 'Транспорт' %}
               href="/kyrgyzstan/transport/"
           {% elif category.title == 'Недвижимость' %}
               href="/kyrgyzstan/nedvizhimost/"
           {% else %}
               href="#"
           {% endif %}>

            {% if category.image %}
                <img src="{{ category.image.url }}"
                     alt="{{ category.title }}">
            {% endif %}

            <h2>{{ category.title }}</h2>

        </a>

    {% empty %}

        <p>Категории пока не добавлены.</p>

    {% endfor %}

</div>
</body>
</html>
